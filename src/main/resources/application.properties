server.port=8080

# Expor o endpoint health
management.endpoints.web.exposure.include=health,prometheus

# Nao expor detalhes internos nos probes publicos
management.endpoint.health.show-details=never


# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


#user
user.password.default=${DEFAULT_USER_PASSWORD}

#secret jwt - 32 caracteres ~
security.jwt.secret=${JWT_SECRET}

# chat bot api key
authentication.chatbot.api.key=${API_KEY_CHATBOT}

# Kafka
app.budget.kafka.enabled=${APP_BUDGET_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:workshop-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.budget.kafka.topic.request=${APP_BUDGET_KAFKA_TOPIC_REQUEST:budget-approval-request}
app.budget.kafka.topic.decision=${APP_BUDGET_KAFKA_TOPIC_DECISION:budget-decision}

# Budget token TTL
app.budget.token.ttl-hours=${APP_BUDGET_TOKEN_TTL_HOURS:48}

# Observabilidade: tags limitadas a aplicacao/ambiente (nunca IDs de clientes ou OS)
spring.application.name=${SPRING_APPLICATION_NAME:mechanic-workshop-system}
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,2s,5s
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.propagation.type=w3c
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:false}
logging.structured.format.console=ecs

# Metricas via scrape Prometheus e logs via stdout/Alloy; sem push OTLP duplicado.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
