groups:
  - name: workshop
    rules:
      - alert: WorkshopUnavailable
        expr: up{job="workshop"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aplicacao indisponivel para coleta"
          description: "Verifique processo, porta, rede e endpoint /actuator/prometheus."
      - alert: WorkshopHighErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="workshop"}[5m])), 0.001)) > 0.05
          and sum(increase(http_server_requests_seconds_count{job="workshop"}[5m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mais de 5% de erros HTTP 5xx"
          description: "Consulte o dashboard e os traces com erro no Tempo."
      - alert: WorkshopHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="workshop",uri!~"/actuator.*"}[5m]))) > 2
          and sum(increase(http_server_requests_seconds_count{job="workshop",uri!~"/actuator.*"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 acima de 2 segundos"
          description: "Inspecione spans HTTP/Kafka e saturacao do pool JDBC."
