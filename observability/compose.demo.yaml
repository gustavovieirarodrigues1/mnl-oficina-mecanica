# Sem bind mounts: funciona mesmo quando o Docker Desktop nao compartilha a pasta Windows.
services:
  application:
    image: workshop-demo-application:local
    build:
      context: ..
      dockerfile: observability/Dockerfile.application
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local,observability
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SEED_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workshop
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    volumes: ["application-logs:/app/logs"]
    networks: [default, dependencies]
  prometheus:
    image: workshop-demo-prometheus:local
    build: {context: ., dockerfile: Dockerfile.config, target: prometheus}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["prometheus-data:/prometheus"]
  tempo:
    image: workshop-demo-tempo:local
    build: {context: ., dockerfile: Dockerfile.config, target: tempo}
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:3200:3200"]
    volumes: ["tempo-data:/var/tempo"]
  loki:
    image: workshop-demo-loki:local
    build: {context: ., dockerfile: Dockerfile.config, target: loki}
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki-data:/loki"]
  alloy:
    image: workshop-demo-alloy:local
    build: {context: ., dockerfile: Dockerfile.config, target: alloy}
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - application-logs:/var/log/workshop:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
  grafana:
    image: workshop-demo-grafana:local
    build: {context: ., dockerfile: Dockerfile.config, target: grafana}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on: [prometheus, tempo, loki]
networks:
  dependencies:
    external: true
    name: docker-local_default
volumes:
  application-logs:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
