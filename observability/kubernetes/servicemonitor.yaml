# Requer Prometheus Operator (por exemplo, kube-prometheus-stack).
apiVersion: v1
kind: Service
metadata:
  name: workshop-metrics
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: workshop-metrics
spec:
  selector:
    app: workshop-backend
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workshop
  namespace: oficina-mecanica
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-metrics
  namespaceSelector:
    matchNames: [oficina-mecanica]
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
